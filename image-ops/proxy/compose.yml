name: mihomo

# Clash.Meta(mihomo) 无头代理：仅供服务器访问 GitHub 等被墙站点（git/Actions/GHCR）。
# host 网络 + 仅绑 127.0.0.1，不对外暴露。真实订阅在 config/config.yaml(不入库)。
services:
  mihomo:
    image: metacubex/mihomo:latest
    container_name: mihomo
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./config:/root/.config/mihomo
