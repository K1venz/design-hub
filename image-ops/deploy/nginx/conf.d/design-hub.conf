log_format design_hub_no_args
    '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
    '$status $body_bytes_sent "$http_user_agent" request_time=$request_time';

upstream design_hub_api {
    server api:8000;
}

# 限流 zone（http 上下文：本文件被 nginx.conf 的 include conf.d/*.conf 纳入 http 块内）。
# 防滥用 A-4 的 nginx 层：app 层 per-user 频控为主防线，此处按 IP 兜底登录/注册爆破。
limit_req_zone $binary_remote_addr zone=reg:10m   rate=5r/m;    # 注册：5 次/分钟
limit_req_zone $binary_remote_addr zone=login:10m rate=15r/m;   # 登录：15 次/分钟
limit_req_status 429;   # 限流拒绝返 429 Too Many Requests（非默认 503，避免误导监控/客户端）

# HTTP → HTTPS 跳转（+ ACME HTTP-01 验证路径：Let's Encrypt 证书签发/自动续期用）
server {
    listen 80;
    server_name _;
    access_log /var/log/nginx/access.log design_hub_no_args;

    # acme.sh --webroot 把校验串写到 web/.well-known/acme-challenge/，nginx 从此路径直出（不跳 https）
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        default_type "text/plain";
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS：前端 SPA(image-web/dist) 静态托管 + /api 去前缀转发后端
server {
    listen 443 ssl;
    http2 on;
    server_name _;
    access_log /var/log/nginx/access.log design_hub_no_args;

    ssl_certificate     /etc/nginx/certs/design-hub.crt;
    ssl_certificate_key /etc/nginx/certs/design-hub.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 50m;   # 产品图/参考图上传

    # A-2 安全加固：隐藏版本 + 安全响应头（always 覆盖 4xx/5xx）
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000"               always;
    add_header X-Frame-Options          "DENY"                            always;
    add_header X-Content-Type-Options   "nosniff"                         always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;

    root  /usr/share/nginx/html;   # image-web/dist
    index index.html;

    # 前端调后端：/api/* 去掉 /api 前缀转发（对齐 Vite dev proxy）
    location /api/ {
        include /etc/nginx/conf.d/proxy_backend.inc;
    }

    # A-4 限流：注册/登录按 IP 限频（精确匹配优先于 /api/ 前缀，故须 include 同一反代块）
    location = /api/auth/register {
        limit_req zone=reg burst=3 nodelay;
        include /etc/nginx/conf.d/proxy_backend.inc;
    }
    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        include /etc/nginx/conf.d/proxy_backend.inc;
    }

    # A-2 收口（/api 这条·关键）：/api/* 经上面 rewrite 去前缀直通后端，
    # 后端 FastAPI 默认开 docs(asgi.py 无 docs_url=None) + Instrumentator expose /metrics，
    # 故根路径堵了还不够，必须在 /api 侧同样堵死文档/契约/指标。
    # 优先级：exact = 最高；/api/docs·/api/redoc 前缀比 /api/ 长，盖得过 /api/。
    location = /api/openapi.json { return 404; }
    location = /api/metrics      { return 404; }
    location /api/docs           { return 404; }
    location /api/redoc          { return 404; }

    # 出图结果静态服务(ISSUE-0029)：公开读、无鉴权(图无安全顾虑)；防目录遍历
    location /img/ {
        alias /usr/share/nginx/img/;
        autoindex off;
        expires 7d;
        access_log off;
    }

    # A-2 收口：文档/契约/指标不对公网暴露。
    # /metrics 由 api 容器内 healthcheck 直连 localhost:8000 自查，不经 nginx，故公网 404 不影响健康检查；
    # 未来 Prometheus 走 docker 网络直接抓 api:8000/metrics，亦不经此 443。
    location = /metrics      { return 404; }
    location = /openapi.json { return 404; }
    location /docs           { return 404; }
    location /redoc          { return 404; }

    # 前端 SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
