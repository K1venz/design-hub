upstream design_hub_api {
    server api:8000;
}

# HTTP → HTTPS 跳转
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# HTTPS：前端 SPA(image-web/dist) 静态托管 + /api 去前缀转发后端
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/design-hub.crt;
    ssl_certificate_key /etc/nginx/certs/design-hub.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 50m;   # 产品图/参考图上传

    root  /usr/share/nginx/html;   # image-web/dist
    index index.html;

    # 前端调后端：/api/* 去掉 /api 前缀转发（对齐 Vite dev proxy）
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://design_hub_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE 友好（/api/generate/* 异步出图进度）
        proxy_buffering           off;
        proxy_cache               off;
        proxy_read_timeout        3600s;
        proxy_send_timeout        3600s;
        chunked_transfer_encoding on;
    }

    # 出图结果静态服务(ISSUE-0029)：公开读、无鉴权(图无安全顾虑)；防目录遍历
    location /img/ {
        alias /usr/share/nginx/img/;
        autoindex off;
        expires 7d;
        access_log off;
    }

    # 运维/接口文档直达后端
    location = /metrics      { proxy_pass http://design_hub_api; }
    location /docs           { proxy_pass http://design_hub_api; }
    location /redoc          { proxy_pass http://design_hub_api; }
    location = /openapi.json { proxy_pass http://design_hub_api; }

    # 前端 SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
