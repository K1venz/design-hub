name: design-hub

# 复用现有 MySQL(/opt/docker/mysql, 网络 mysql_default)；Redis 仅在项目内网提供队列服务。
services:
  dkim:
    build:
      context: ./mail/opendkim
    image: design-hub-opendkim:${MAIL_IMAGE_RELEASE:-stable}
    container_name: design-hub-dkim
    restart: unless-stopped
    volumes:
      - ${DESIGN_HUB_DATA_DIR:?DESIGN_HUB_DATA_DIR is required}/mail/dkim:/etc/dkimkeys
    networks:
      mail:
        ipv4_address: 172.29.0.11
    expose:
      - "8891"
    mem_limit: 128m
    cpus: "0.25"
    pids_limit: 64
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8891"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  smtp:
    build:
      context: ./mail/postfix
    image: design-hub-postfix:${MAIL_IMAGE_RELEASE:-stable}
    container_name: design-hub-smtp
    restart: unless-stopped
    environment:
      MAIL_HOSTNAME: smtp.image.sepaitech.com
      MAIL_DOMAIN: image.sepaitech.com
      MAIL_NETWORKS: 172.29.0.0/24
    volumes:
      - ${DESIGN_HUB_DATA_DIR:?DESIGN_HUB_DATA_DIR is required}/mail/spool:/var/spool/postfix
    networks:
      mail:
        ipv4_address: 172.29.0.10
    depends_on:
      dkim:
        condition: service_healthy
    expose:
      - "25"
    mem_limit: 256m
    cpus: "0.25"
    pids_limit: 128
    healthcheck:
      test: ["CMD-SHELL", "postfix status >/dev/null && nc -z 127.0.0.1 25"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  redis:
    image: redis:8-alpine
    container_name: design-hub-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --aof-use-rdb-preamble
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - ${DESIGN_HUB_DATA_DIR:?DESIGN_HUB_DATA_DIR is required}/redis:/data
    networks:
      - default
    expose:
      - "6379"
    mem_limit: 384m
    cpus: "0.50"
    pids_limit: 128
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  api:
    build:
      context: ../app
      labels:
        cn.design-hub.release-id: ${RELEASE_ID:?RELEASE_ID is required}
        cn.design-hub.source-commit: ${SOURCE_COMMIT:?SOURCE_COMMIT is required}
        cn.design-hub.image-repository: ${API_IMAGE_REPOSITORY:-design-hub-api}
    image: ${API_IMAGE_REFERENCE:-${API_IMAGE_REPOSITORY:-design-hub-api}:${RELEASE_ID:?RELEASE_ID is required}}
    container_name: design-hub-api
    restart: unless-stopped
    env_file:
      - ${DESIGN_HUB_ENV_FILE:?DESIGN_HUB_ENV_FILE is required}
    volumes:
      - ${DESIGN_HUB_DATA_DIR:?DESIGN_HUB_DATA_DIR is required}/generated:/app/generated
      - ${DESIGN_HUB_DATA_DIR:?DESIGN_HUB_DATA_DIR is required}/assets:/app/assets
      - ${DESIGN_HUB_DATA_DIR:?DESIGN_HUB_DATA_DIR is required}/exports:/app/exports
    networks:
      - default        # 与 nginx 同网
      - mysql_default   # 连现有 MySQL（host=mysql:3306）
      - mail
    depends_on:
      redis:
        condition: service_healthy
      smtp:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/metrics',timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    labels:
      com.design-hub.release: ${RELEASE_ID:?RELEASE_ID is required}

  worker:
    image: ${API_IMAGE_REFERENCE:-${API_IMAGE_REPOSITORY:-design-hub-api}:${RELEASE_ID:?RELEASE_ID is required}}
    container_name: design-hub-worker
    restart: unless-stopped
    command: ["python", "-m", "design_hub.interface.worker"]
    stop_grace_period: 45s
    env_file:
      - ${DESIGN_HUB_ENV_FILE:?DESIGN_HUB_ENV_FILE is required}
    volumes:
      - ${DESIGN_HUB_DATA_DIR:?DESIGN_HUB_DATA_DIR is required}/generated:/app/generated
      - ${DESIGN_HUB_DATA_DIR:?DESIGN_HUB_DATA_DIR is required}/assets:/app/assets
      - ${DESIGN_HUB_DATA_DIR:?DESIGN_HUB_DATA_DIR is required}/exports:/app/exports
    networks:
      - default
      - mysql_default
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import os,socket;
          from redis import Redis;
          r=Redis.from_url(os.environ["REDIS_URL"],decode_responses=True,socket_connect_timeout=3,socket_timeout=3);
          consumers=r.xinfo_consumers("design-hub:generation:v1","generation-workers-v1");
          assert any(str(c["name"]).startswith(socket.gethostname()) for c in consumers);
          r.close()
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    labels:
      com.design-hub.release: ${RELEASE_ID:?RELEASE_ID is required}

  nginx:
    image: nginx:1.27-alpine
    container_name: design-hub-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${DESIGN_HUB_RELEASE_DIR:?DESIGN_HUB_RELEASE_DIR is required}/deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - ${DESIGN_HUB_SHARED_DIR:?DESIGN_HUB_SHARED_DIR is required}/nginx/certs:/etc/nginx/certs:ro
      - ${DESIGN_HUB_RELEASE_DIR:?DESIGN_HUB_RELEASE_DIR is required}/web:/usr/share/nginx/html:ro
      - ${DESIGN_HUB_STATE_DIR:?DESIGN_HUB_STATE_DIR is required}:/etc/design-hub-state:ro
      - ${DESIGN_HUB_DATA_DIR:?DESIGN_HUB_DATA_DIR is required}/generated:/usr/share/nginx/img:ro
    networks:
      - default
    labels:
      com.design-hub.release: ${RELEASE_ID:?RELEASE_ID is required}

networks:
  default:
  mail:
    ipam:
      config:
        - subnet: 172.29.0.0/24
  mysql_default:
    external: true
