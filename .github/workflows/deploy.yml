name: deploy

# push 到 main 自动部署（方案 B：服务器上的 self-hosted runner 本地部署，不走跨境 SSH）。
# 由运维(image-ops)维护。runner=design-hub-prod(systemd, 走 mihomo 代理连 GitHub)。
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false   # 部署排队，不互相打断

jobs:
  deploy:
    runs-on: [self-hosted, prod]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: image-web/.nvmrc

      - name: Build frontend (image-web)
        working-directory: image-web
        run: |
          # --legacy-peer-deps 临时绕开 typescript 6 vs openapi-typescript peer 冲突(ISSUE-0027)
          npm ci --legacy-peer-deps
          npm run build

      - name: Deploy locally (runner 就在服务器上，本地拷贝 + deploy.sh)
        run: |
          set -e
          DEST=/opt/docker/design-hub
          # 后端源码 → app/（--delete 保净；保护 Dockerfile/.dockerignore，不删服务器 .env/certs/web）
          rsync -a --delete \
            --exclude '.venv/' --exclude '__pycache__/' --exclude '*.pyc' \
            --exclude '.mypy_cache/' --exclude '.ruff_cache/' --exclude '.pytest_cache/' \
            --exclude '*.db' --exclude 'generated/' --exclude 'assets/' --exclude 'exports/' \
            --exclude '.env' --exclude '.env.development' --exclude '.DS_Store' --exclude '.git/' \
            --exclude 'Dockerfile' --exclude '.dockerignore' \
            image-code/ "$DEST/app/"
          # 部署产物（含 app/Dockerfile、compose、nginx、scripts）
          rsync -a image-ops/deploy/ "$DEST/"
          # 前端构建产物
          rsync -a --delete image-web/dist/ "$DEST/web/"
          # 构建后端 + 迁移 + 重启（幂等）
          cd "$DEST" && bash scripts/deploy.sh
