name: pr-gate

# PR 门禁（B-1②/B-2/B-3 安全加固）。
# 旧逻辑：push→main 由 prod 上的 self-hosted runner 自动 build+迁移+部署
#   = 双部署(与 ops 手动重叠) + runner-on-prod RCE 面 + 零门禁。已废止。
# 新逻辑：仅做合并前检查（ruff / pytest / 前端 lint+typecheck+test / gitleaks），
#   跑在 GitHub 托管 runner（无 prod 访问、无 self-hosted runner）。
#   过门禁才允许合并；部署改由 ops 手动执行（deploy.sh，迁移前强制 mysqldump 备份）。
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pr-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  backend:
    name: 后端门禁 (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install deps
        working-directory: image-code
        run: uv sync --all-groups
      - name: Ruff lint
        working-directory: image-code
        run: uv run ruff check
      - name: Pytest
        working-directory: image-code
        run: uv run pytest

  frontend:
    name: 前端门禁 (lint + typecheck + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: image-web/.nvmrc
      - name: Install deps
        working-directory: image-web
        # --legacy-peer-deps 临时绕开 typescript 6 vs openapi-typescript peer 冲突(ISSUE-0027)
        run: npm ci --legacy-peer-deps
      - name: ESLint
        working-directory: image-web
        run: npm run lint
      - name: Typecheck
        working-directory: image-web
        run: npm run typecheck
      - name: Vitest
        working-directory: image-web
        run: npm run test

  secret-scan:
    name: 密钥扫描 (gitleaks 全历史)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 全历史，gitleaks 扫所有提交
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          # gitleaks-action v2 在 pull_request 事件下必需（读 PR 元数据），非扫描授权变更
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
