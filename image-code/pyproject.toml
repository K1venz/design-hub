[project]
name = "design-hub"
version = "0.1.0"
description = "设计中台图生图引擎核心（design_hub）"
readme = "README.md"
authors = [
    { name = "Kiven zhao", email = "200728390+K1venz@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiomysql>=0.3.2",
    "alembic>=1.18.4",
    "arq>=0.28.0",
    "fastapi>=0.136.3",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "sqlalchemy[asyncio]>=2.0.50",
    "structlog>=25.5.0",
    "uvicorn>=0.48.0",
]

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "httpx>=0.28.1",
    "mypy>=2.1.0",
    "ruff>=0.15.14",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

# redis.asyncio 部分接口未带类型标注，仅对该适配器放宽"调用未类型化函数"检查
[[tool.mypy.overrides]]
module = "design_hub.infrastructure.events.redis_bus"
disallow_untyped_calls = false
